[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scm4opt"
version = "4.1.0"
description = "SCM4OPT: Simple Climate Model for OPTimization (Python version)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "scm4opt/data/MAGICC6/NOTICE.txt"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
scm4opt = "scm4opt.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]                # tests import the package from the repository root
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["scm4opt*"]

[tool.setuptools.package-data]
# parameter tables and the bundled scenario inputs (other inputs in scm4opt/data are not packaged)
scm4opt = [
    "data/AR6/**/*",
    "data/CMIP6/**/*",
    "data/CMonitor/**/*",
    "data/MAGICC6/**/*",
    "data/RCMIP/**/*",
    "data/RCMIP3_src/**/*",
