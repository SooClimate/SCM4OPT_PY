name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Versions
        run: python -c "import sys, numpy, pandas, scipy; print(sys.version, numpy.__version__, pandas.__version__, scipy.__version__)"
      - name: Registry check
        run: python -m scm4opt.core.registry
      - name: Scenario inputs against their checksums
        run: python -m scm4opt data verify
      - name: Tests
        run: python -m pytest -q
